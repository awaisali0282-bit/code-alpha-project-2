<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Code Review</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <div class="logo">
            SHIELD<span>X</span>
        </div>

        <div class="status">

            <span id="statusDot"></span>

            <span id="statusText">
                CONNECTING...
            </span>

        </div>

    </header>


    <main>

        <section class="hero">

            <div class="badge">
                CYBERSECURITY TOOL
            </div>

            <h1>
                SECURE CODE
                <span>REVIEW</span>
            </h1>

            <p>
                Analyze source code for common security vulnerabilities.
            </p>

        </section>


        <section class="workspace">

            <div class="editor-panel">

                <div class="panel-title">
                    SOURCE CODE
                </div>

                <textarea
                    id="codeInput"
                    placeholder="Paste your code here..."
                ></textarea>

                <button
                    onclick="analyzeCode()"
                    class="analyze-button"
                >
                    ANALYZE CODE
                </button>

            </div>


            <div class="results-panel">

                <div class="panel-title">
                    SECURITY RESULTS
                </div>


                <div class="stats">

                    <div class="stat high">
                        <span>HIGH</span>
                        <strong id="highCount">0</strong>
                    </div>

                    <div class="stat medium">
                        <span>MEDIUM</span>
                        <strong id="mediumCount">0</strong>
                    </div>

                    <div class="stat low">
                        <span>LOW</span>
                        <strong id="lowCount">0</strong>
                    </div>

                </div>


                <div id="results">

                    <div class="empty">
                        <strong>
                            NO ANALYSIS YET
                        </strong>

                        <span>
                            Enter code and click Analyze Code.
                        </span>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>
        SHIELDX • SECURE CODE REVIEW • CYBERSECURITY PROJECT
    </footer>


    <script src="script.js"></script>

</body>

</html>
